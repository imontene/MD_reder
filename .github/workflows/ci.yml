name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Smoke test built CLI
        shell: bash
        run: |
          node dist/cli.js --version
          node dist/cli.js --help
          node dist/cli.js tests/fixtures/sample.md -o out/
          node dist/cli.js tests/fixtures/sample.md -f html -o out/
          node dist/cli.js tests/fixtures/math.md -o out/
          node dist/cli.js tests/fixtures/mermaid.md -o out/
          test -s out/sample.pdf && test -s out/sample.html
          test -s out/math.pdf && test -s out/mermaid.pdf

      - name: Upload sample output
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: sample-${{ matrix.os }}
          path: out/
