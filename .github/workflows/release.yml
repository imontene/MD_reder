name: Release

# Publishes a version: builds the executables, creates the GitHub Release (and its tag) with
# SHA-256 sums and, when the NPM_TOKEN secret is configured, publishes the package to npm.
#
# Start it either way:
#   - push a tag:        git tag v1.0.0 && git push origin v1.0.0
#   - or run it by hand: Actions → Release → Run workflow, with the version (e.g. 1.0.0).
#     The tag is created by the release itself, on the commit the workflow runs from.
# Without a tag or a version it only builds the executables (a dry run).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.0.0 (must match package.json). Empty: build only."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Resolve and check the version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            tag="v${INPUT_VERSION#v}"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No tag or version: build only."
            exit 0
          fi
          version="${tag#v}"
          package_version="$(node -p 'require("./package.json").version')"
          if [ "$version" != "$package_version" ]; then
            echo "::error::Version $version does not match package.json ($package_version)."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag"

  executables:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, optional: false }
          - { os: windows-latest, target: win-x64, optional: false }
          # Hosted ARM runners may not be available for every repository.
          - { os: ubuntu-24.04-arm, target: linux-arm64, optional: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:exe

      - name: Package
        shell: bash
        run: |
          name="mdrender-${{ needs.prepare.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist-release/$name"
          exe=build/sea/mdrender; [ -f "$exe.exe" ] && exe="$exe.exe"
          cp "$exe" build/sea/THIRD-PARTY-NOTICES.txt README.md LICENSE "dist-release/$name/"
          cd dist-release
          if [ "${{ runner.os }}" = Windows ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist-release/*

  release:
    name: GitHub Release
    needs: [prepare, executables]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        # --target creates the tag on this commit when it does not exist yet (manual runs).
        run: |
          gh release create "$TAG" assets/* --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --title "mdrender $TAG" --generate-notes

  npm:
    name: Publish to npm
    needs: [prepare, executables]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not configured: skipping npm publish."
            exit 0
          fi
          npm publish --provenance --access public
